
name: CQA Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CQA
        uses: actions/checkout@v4

      - name: Install Lean 4
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build CQA
        run: lake build

      - name: Test CQA
        run: lake test

      - name: Scan CQA Lean sources
        run: lake exe cqa . --json
