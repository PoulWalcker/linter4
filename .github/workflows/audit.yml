
name: Linter4 Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Linter4
        uses: actions/checkout@v4

      - name: Install Lean 4
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Linter4
        run: lake build

      - name: Test Linter4
        run: lake test

      - name: Scan Linter4 Lean sources
        run: lake exe linter4 .
