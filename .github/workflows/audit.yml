
name: CQA Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CQA
        uses: actions/checkout@v4

      - name: Install Lean 4
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build CQA
        run: |
          lake update
          lake build

      - name: Download Sapiens4
        run: |
          git clone --depth 1 --branch dev https://github.com/aleski-green/sapiens4.git /tmp/sapiens4

      - name: Run CQA
        run: lake exe cqa /tmp/sapiens4
